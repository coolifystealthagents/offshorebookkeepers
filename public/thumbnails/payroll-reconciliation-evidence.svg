<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Payroll reconciliation evidence flow</title>
  <desc id="desc">The approved payroll register passes through an evidence review and ties to bank settlement, liability rollforward, and the general ledger.</desc>
  <defs>
    <linearGradient id="payroll-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0e4"/><stop offset="1" stop-color="#e7f5f2"/></linearGradient>
    <linearGradient id="payroll-core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d4c"/><stop offset="1" stop-color="#087f84"/></linearGradient>
    <filter id="payroll-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#123d4c" flood-opacity=".14"/></filter>
    <marker id="payroll-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#109b91"/></marker>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#payroll-bg)"/>
  <circle cx="1110" cy="45" r="150" fill="#75d3ca" opacity=".16"/>
  <text x="54" y="76" fill="#123d4c" font-family="Arial,sans-serif" font-size="46" font-weight="800">Payroll reconciliation evidence</text>

  <g filter="url(#payroll-shadow)">
    <rect x="54" y="150" width="275" height="360" rx="26" fill="#fff" stroke="#afd3ce" stroke-width="2"/>
    <path d="M54 176a26 26 0 0 1 26-26h223a26 26 0 0 1 26 26v58H54Z" fill="#123d4c"/>
    <text x="86" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Payroll register</text>
    <g fill="#dcefeb"><rect x="88" y="278" width="205" height="25" rx="12"/><rect x="88" y="327" width="175" height="25" rx="12"/><rect x="88" y="376" width="195" height="25" rx="12"/></g>
    <circle cx="110" cy="451" r="19" fill="#0c9b83"/><path d="m100 451 7 7 15-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="143" y="462" fill="#174b55" font-family="Arial,sans-serif" font-size="27" font-weight="700">Approved</text>
  </g>

  <path d="M329 330H435" fill="none" stroke="#109b91" stroke-width="9" stroke-linecap="round" marker-end="url(#payroll-arrow)"/>
  <g filter="url(#payroll-shadow)">
    <rect x="432" y="214" width="270" height="232" rx="38" fill="url(#payroll-core)"/>
    <circle cx="567" cy="300" r="51" fill="none" stroke="#8ce1d9" stroke-width="7"/>
    <path d="m539 300 19 20 39-48" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="567" y="387" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="800">Review</text>
  </g>

  <g fill="none" stroke="#109b91" stroke-width="8" stroke-linecap="round" marker-end="url(#payroll-arrow)"><path d="M702 270C750 238 763 204 798 193"/><path d="M702 330H798"/><path d="M702 390C750 422 763 456 798 467"/></g>

  <g filter="url(#payroll-shadow)" font-family="Arial,sans-serif">
    <rect x="795" y="125" width="350" height="135" rx="23" fill="#fff" stroke="#afd3ce" stroke-width="2"/>
    <circle cx="850" cy="193" r="31" fill="#d9f1ec"/><path d="M831 193h38M838 180v26M862 180v26" stroke="#087f84" stroke-width="5" stroke-linecap="round"/>
    <text x="898" y="202" fill="#123d4c" font-size="32" font-weight="800">Cash</text>

    <rect x="795" y="282" width="350" height="135" rx="23" fill="#fff" stroke="#afd3ce" stroke-width="2"/>
    <circle cx="850" cy="350" r="31" fill="#e1eaf3"/><path d="M833 369v-38h34v38M840 353h20" fill="none" stroke="#355f78" stroke-width="5" stroke-linecap="round"/>
    <text x="898" y="359" fill="#123d4c" font-size="29" font-weight="800">Liabilities</text>

    <rect x="795" y="439" width="350" height="135" rx="23" fill="#fff" stroke="#afd3ce" stroke-width="2"/>
    <circle cx="850" cy="507" r="31" fill="#e8e5f5"/><path d="M832 491h36M832 507h36M832 523h25" stroke="#515385" stroke-width="5" stroke-linecap="round"/>
    <text x="898" y="516" fill="#123d4c" font-size="32" font-weight="800">Ledger</text>
  </g>
</svg>
