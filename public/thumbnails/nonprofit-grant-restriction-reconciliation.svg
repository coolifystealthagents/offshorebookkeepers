<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nonprofit grant restriction reconciliation flow</title>
  <desc id="desc">Governing grant terms feed an award master, which is reconciled to qualifying evidence, the general ledger, and grant reporting.</desc>
  <defs>
    <linearGradient id="grant-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f1e4"/><stop offset="1" stop-color="#e7f5f1"/></linearGradient>
    <linearGradient id="grant-core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f4d"/><stop offset="1" stop-color="#0b7f78"/></linearGradient>
    <filter id="grant-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#143c49" flood-opacity=".14"/></filter>
    <marker id="grant-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#159b90"/></marker>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#grant-bg)"/>
  <path d="M980 0h220v185c-90-14-164-75-220-185Z" fill="#78d2c7" opacity=".17"/>
  <text x="54" y="76" fill="#173f4d" font-family="Arial,sans-serif" font-size="46" font-weight="800">Grant restriction reconciliation</text>

  <g filter="url(#grant-shadow)" font-family="Arial,sans-serif">
    <rect x="54" y="155" width="280" height="350" rx="26" fill="#fff" stroke="#b4d5cf" stroke-width="2"/>
    <path d="M54 181a26 26 0 0 1 26-26h228a26 26 0 0 1 26 26v63H54Z" fill="#173f4d"/>
    <text x="87" y="213" fill="#fff" font-size="32" font-weight="800">Terms</text>
    <rect x="91" y="282" width="206" height="123" rx="16" fill="#edf6f3"/>
    <path d="M120 316h148M120 345h124M120 374h139" stroke="#81b8af" stroke-width="9" stroke-linecap="round"/>
    <circle cx="119" cy="451" r="20" fill="#0d9783"/><path d="m108 451 8 8 16-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="153" y="462" fill="#174b55" font-size="27" font-weight="700">Approved</text>
  </g>

  <path d="M334 330H439" fill="none" stroke="#159b90" stroke-width="9" stroke-linecap="round" marker-end="url(#grant-arrow)"/>
  <g filter="url(#grant-shadow)" font-family="Arial,sans-serif">
    <rect x="436" y="188" width="276" height="284" rx="34" fill="url(#grant-core)"/>
    <text x="574" y="239" text-anchor="middle" fill="#fff" font-size="37" font-weight="800">Award</text>
    <rect x="474" y="270" width="200" height="143" rx="18" fill="#fff"/>
    <path d="M508 309h132M508 342h105M508 375h122" stroke="#75c9bf" stroke-width="12" stroke-linecap="round"/>
    <text x="574" y="444" text-anchor="middle" fill="#c7f0ea" font-size="27" font-weight="700">Rollforward</text>
  </g>

  <g fill="none" stroke="#159b90" stroke-width="8" stroke-linecap="round" marker-end="url(#grant-arrow)"><path d="M712 267C759 236 774 202 811 191"/><path d="M712 330H811"/><path d="M712 393C759 424 774 458 811 469"/></g>

  <g filter="url(#grant-shadow)" font-family="Arial,sans-serif">
    <rect x="808" y="124" width="337" height="138" rx="23" fill="#fff" stroke="#b4d5cf" stroke-width="2"/>
    <circle cx="861" cy="193" r="31" fill="#d8f1ec"/><path d="m843 193 12 12 25-31" fill="none" stroke="#10887e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="909" y="184" fill="#173f4d" font-size="29" font-weight="800">Evidence</text>
    <text x="909" y="220" fill="#587078" font-size="25">Approved costs</text>

    <rect x="808" y="281" width="337" height="138" rx="23" fill="#fff" stroke="#b4d5cf" stroke-width="2"/>
    <circle cx="861" cy="350" r="31" fill="#e1eaf3"/><path d="M843 333h36M843 350h36M843 367h25" stroke="#355f78" stroke-width="5" stroke-linecap="round"/>
    <text x="909" y="359" fill="#173f4d" font-size="33" font-weight="800">Ledger</text>

    <rect x="808" y="438" width="337" height="138" rx="23" fill="#fff" stroke="#b4d5cf" stroke-width="2"/>
    <circle cx="861" cy="507" r="31" fill="#f4ead7"/><path d="M843 488h36v38h-36zM850 498h22M850 511h16" fill="none" stroke="#986b25" stroke-width="5" stroke-linecap="round"/>
    <text x="909" y="516" fill="#173f4d" font-size="33" font-weight="800">Report</text>
  </g>
</svg>
