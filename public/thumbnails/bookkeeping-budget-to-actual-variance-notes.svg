<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Budget-to-actual variance notes workflow illustration</title><desc id="desc">A source record moves to a prepared workpaper and then to client review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdf2f8"/><stop offset="1" stop-color="#fffaf0"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="10" flood-color="#3f1d2e" flood-opacity=".12"/></filter><style>.k{font:800 16px Arial,sans-serif;letter-spacing:2px;fill:#be185d}.headline{font:800 46px Arial,sans-serif;fill:#3f1d2e}.label{font:800 22px Arial,sans-serif;fill:#3f1d2e}.small{font:700 15px Arial,sans-serif;fill:#52606d}.card{fill:#fff;stroke:#3f1d2e;stroke-opacity:.16;stroke-width:2;filter:url(#s)}.icon{fill:none;stroke:#be185d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1090" cy="90" r="170" fill="#be185d" opacity=".08"/><text x="72" y="62" class="k">OFFSHOREBOOKKEEPERS • WORKFLOW GUIDE</text><text x="72" y="126" class="headline">Budget-to-actual variance notes</text>
<g transform="translate(72 202)"><rect width="292" height="205" rx="24" class="card"/><text x="26" y="38" class="k">01 • INPUT</text><g class="icon" transform="translate(112 57)"><path d="M0 0h58v76H0zM12 20h34M12 35h34M12 50h24"/></g><text x="146" y="171" text-anchor="middle" class="label">Source records</text></g>
<path d="M383 304h55m-14-14 14 14-14 14" class="icon"/>
<g transform="translate(454 202)"><rect width="292" height="205" rx="24" class="card"/><text x="26" y="38" class="k">02 • PREPARE</text><g class="icon" transform="translate(113 60)"><path d="M0 10l14 14L42 0M0 51l14 14 28-24M55 12h48M55 53h48"/></g><text x="146" y="171" text-anchor="middle" class="label">Review workpaper</text></g>
<path d="M765 304h55m-14-14 14 14-14 14" class="icon"/>
<g transform="translate(836 202)"><rect width="292" height="205" rx="24" class="card"/><text x="26" y="38" class="k">03 • DECIDE</text><g class="icon" transform="translate(112 56)"><circle cx="30" cy="22" r="20"/><path d="M0 78c5-26 55-26 60 0M72 20h34M72 38h25"/></g><text x="146" y="171" text-anchor="middle" class="label">Client review</text></g>
<rect x="72" y="585" width="1056" height="2" fill="#3f1d2e" opacity=".12"/><text x="72" y="612" class="small">Preparation stays separate from protected approval and accounting judgment.</text></svg>