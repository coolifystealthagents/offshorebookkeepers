<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Audit Document Support workflow</title><desc id="desc">Request list moves through Indexed evidence to Client handoff. QUESTIONS ROUTED.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5EE"/><stop offset="1" stop-color="#EAF3F0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="9" stdDeviation="10" flood-color="#0B1F3A" flood-opacity=".10"/></filter><style>.title{font:800 34px Inter,Arial,sans-serif;letter-spacing:2px;fill:#0B1F3A}.meta{font:800 18px Inter,Arial,sans-serif;letter-spacing:2px;fill:#0F8F73}.step{font:800 26px Inter,Arial,sans-serif;fill:#0B1F3A}.card{fill:#fff;stroke:#D8E3DF;stroke-width:2;filter:url(#shadow)}.icon{fill:none;stroke:#0F8F73;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#0B1F3A;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.num-bg{fill:#F2B84B}.num{font:900 20px Inter,Arial,sans-serif;fill:#0B1F3A}.note{font:800 23px Inter,Arial,sans-serif;letter-spacing:1px;fill:#fff}</style></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1110" cy="108" r="138" fill="#0F8F73" opacity=".08"/><path d="M40 125h1120" stroke="#0B1F3A" stroke-opacity=".12"/><text x="55" y="83" class="title">AUDIT DOCUMENT SUPPORT</text><g><rect x="55" y="178" width="300" height="292" rx="28" class="card"/><text x="83" y="215" class="meta">INPUT</text><g class="icon" transform="translate(0 -12)"><path d="M181 226h48v58h-48z M191 240h28 M191 252h28 M191 264h20"/></g><text x="205" y="326" text-anchor="middle" class="step">Request list</text><circle cx="313" cy="214" r="18" class="num-bg"/><text x="313" y="222" text-anchor="middle" class="num">1</text></g><g><rect x="420" y="178" width="300" height="292" rx="28" class="card"/><text x="448" y="215" class="meta">PREPARE</text><g class="icon" transform