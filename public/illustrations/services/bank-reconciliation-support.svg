<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Bank Reconciliation workflow</title><desc id="desc">Statement + ledger moves through Match activity to Difference review. OPEN ITEMS VISIBLE.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5EE"/><stop offset="1" stop-color="#EAF3F0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="9" stdDeviation="10" flood-color="#17324D" flood-opacity=".10"/></filter><style>.title{font:800 34px Inter,Arial,sans-serif;letter-spacing:2px;fill:#17324D}.meta{font:800 24px Inter,Arial,sans-serif;letter-spacing:2px;fill:#C94D2D}.step{font:800 26px Inter,Arial,sans-serif;fill:#17324D}.card{fill:#fff;stroke:#D8E3DF;stroke-width:2;filter:url(#shadow)}.icon{fill:none;stroke:#C94D2D;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#17324D;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.num-bg{fill:#5BB7A7}.num{font:900 24px Inter,Arial,sans-serif;fill:#17324D}.note{font:800 28px Inter,Arial,sans-serif;letter-spacing:1px;fill:#fff}</style></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1110" cy="126" r="138" fill="#C94D2D" opacity=".08"/><path d="M40 125h1120" stroke="#17324D" stroke-opacity=".12"/><text x="55" y="83" class="title">BANK RECONCILIATION</text><g><rect x="55" y="178" width="300" height="292" rx="28" class="card"/><text x="83" y="215" class="meta">INPUT</text><g class="icon" transform="translate(0 4)"><circle cx="205" cy="255" r="27"/><path d="M191 255l10 10 20-22"/></g><text x="205" y="304" text-anchor="middle" transform="translate(0 16)" class="step">Statement</text><text x="205" y="352" text-anchor="middle" transform="translate(0 16)" class="step">+ ledger</text><circle cx="313" cy="214" r="18" class="num-bg"/><text x="313" y="222" text-anchor="middle" class="num">1</text></g><g><rect x="420" y="178" width="300" height="292" rx="28" class="card"/><text x="448" y="215" class="meta">PREPARE</text><g class="icon" transform="translate(0 4)"><path d="M540 270l30-48 30 48z M570 238v19 M570 264v2"/></g><text x="570" y="326" text-anchor="middle" transform="translate(0 16)" class="step">Match activity</text><circle cx="678" cy="214" r="18" class="num-bg"/><text x="678" y="222" text-anchor="middle" class="num">2</text></g><g><rect x="785" y="178" width="300" height="292" rx="28" class="card"/><text x="813" y="215" class="meta">HANDOFF</text><g class="icon" transform="translate(0 4)"><path d="M906 241h58v45h-58z M919 241v-12h32v12 M906 257h58"/></g><text x="935" y="326" text-anchor="middle" transform="translate(0 16)" class="step">Difference review</text><circle cx="1043" cy="214" r="18" class="num-bg"/><text x="1043" y="222" text-anchor="middle" class="num">3</text></g><path d="M365 324h37m-13-13 13 13-13 13 M730 324h37m-13-13 13 13-13 13" class="arrow"/><rect x="55" y="514" width="1090" height="70" rx="22" fill="#17324D"/><circle cx="92" cy="549" r="12" fill="#5BB7A7"/><text x="121" y="557" class="note">OPEN ITEMS VISIBLE</text></svg>