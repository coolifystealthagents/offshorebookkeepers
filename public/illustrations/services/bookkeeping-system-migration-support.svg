<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">System Migration workflow</title><desc id="desc">Source data moves through Approved mapping to Trial-load tie-out. DEFECTS LISTED.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5EE"/><stop offset="1" stop-color="#EAF3F0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="9" stdDeviation="10" flood-color="#163B36" flood-opacity=".10"/></filter><style>.title{font:800 34px Inter,Arial,sans-serif;letter-spacing:2px;fill:#163B36}.meta{font:800 18px Inter,Arial,sans-serif;letter-spacing:2px;fill:#8A5A25}.step{font:800 26px Inter,Arial,sans-serif;fill:#163B36}.card{fill:#fff;stroke:#D8E3DF;stroke-width:2;filter:url(#shadow)}.icon{fill:none;stroke:#8A5A25;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#163B36;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.num-bg{fill:#E69A68}.num{font:900 20px Inter,Arial,sans-serif;fill:#163B36}.note{font:800 23px Inter,Arial,sans-serif;letter-spacing:1px;fill:#fff}</style></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1110" cy="109" r="138" fill="#8A5A25" opacity=".08"/><path d="M40 125h1120" stroke="#163B36" stroke-opacity=".12"/><text x="55" y="83" class="title">SYSTEM MIGRATION</text><g><rect x="55" y="178" width="300" height="292" rx="28" class="card"/><text x="83" y="215" class="meta">INPUT</text><g class="icon" transform="translate(0 -12)"><path d="M175 270l30-48 30 48z M205 238v19 M205 264v2"/></g><text x="205" y="326" text-anchor="middle" class="step">Source data</text><circle cx="313" cy="214" r="18" class="num-bg"/><text x="313" y="222" text-anchor="middle" class="num">1</text></g><g><rect x="420" y="178" width="300" height="292" rx="28" class="card"/><text x="448" y="215" class="meta">PREPARE</text><g class="icon" transform="translate(0 -12)"><path d="M541 241h58v45h-58z M554 241v-12h32v12 M541 257h58"/></g><text x="570" y="326" text-anchor="middle" class="step">Approved mapping</text><circle cx="678" cy="214" r="18" class="num-bg"/><text x="678" y="222" text-anchor="middle" class="num">2</text></g><g><rect x="785" y="178" width="300" height="292" rx="28" class="card"/><text x="813" y="215" class="meta">HANDOFF</text><g class="icon" transform="translate(0 -12)"><path d="M911 226h48v58h-48z M921 240h28 M921 252h28 M921 264h20"/></g><text x="935" y="304" text-anchor="middle" class="step">Trial-load</text><text x="935" y="352" text-anchor="middle" class="step">tie-out</text><circle cx="1043" cy="214" r="18" class="num-bg"/><text x="1043" y="222" text-anchor="middle" class="num">3</text></g><path d="M365 324h37m-13-13 13 13-13 13 M730 324h37m-13-13 13 13-13 13" class="arrow"/><rect x="55" y="514" width="1090" height="70" rx="22" fill="#163B36"/><circle cx="92" cy="549" r="12" fill="#E69A68"/><text x="121" y="557" class="note">DEFECTS LISTED</text></svg>